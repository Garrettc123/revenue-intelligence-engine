name: RHNS Revenue Intelligence Cycle
run-name: ${{ inputs.rhns_dispatch_id && format('RHNS/{0}', inputs.rhns_dispatch_id) || format('Scheduled Revenue {0}', github.run_id) }}

on:
  schedule:
    - cron: "0 * * * *"   # Every hour
  workflow_dispatch:
    inputs:
      rhns_dispatch_id:
        description: "Opaque RHNS dispatch correlation ID; manual scheduling unaffected"
        required: false
        type: string
      debug:
        description: 'Enable debug output'
        required: false
        default: 'false'

permissions:
  contents: read

jobs:
  intelligence-cycle:
    name: Revenue Intelligence Cycle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      
      - name: Install dependencies
        run: pip install -r requirements.txt
      
      - name: Run RHNS Revenue Intelligence
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          HUBSPOT_API_KEY: ${{ secrets.HUBSPOT_API_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.DEFENDER_SLACK_WEBHOOK }}
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
        run: python engine.py
      
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: intelligence-output-${{ github.run_id }}
          path: output/
          retention-days: 30
